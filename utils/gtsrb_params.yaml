---
type: gtsrb
name: gtsrb

# data & optimization
batch_size: 64
test_batch_size: 64
lr: 0.1
poison_lr: 0.05
momentum: 0.9
decay: 0.0005
poison_momentum: 0.9
poison_decay: 0.005
epochs: 300
